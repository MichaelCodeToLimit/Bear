# Builds every Bear download and, for v* tags, drafts a GitHub release with all of them.
#
# Bear ships as three editions: the full suite ("all"), Bear Office and Bear Studio. Each is built by its own
# matrix entry with BEAR_EDITION set (electron-builder and the renderer build both read it).
#
# Files produced (the website's Download page classifies them by name, so keep these stable):
#   Edition "all" (Bear)
#     Windows  Bear-Setup-<v>.exe, Bear-<v>.msi
#     macOS    Bear-<v>-arm64.dmg, Bear-<v>-x64.dmg, Bear-<v>-arm64-mac.zip, Bear-<v>-x64-mac.zip
#     Linux    Bear-<v>-x64.AppImage, bear_<v>_amd64.deb, Bear-<v>-x64.rpm, Bear-<v>-x64.tar.gz,
#              Bear-<v>-x64.flatpak (own job; a failure there never blocks the release)
#   Edition "office" (Bear Office)
#     Windows  Bear-Office-Setup-<v>.exe, Bear-Office-<v>.msi
#     macOS    Bear-Office-<v>-arm64.dmg, Bear-Office-<v>-x64.dmg, Bear-Office-<v>-arm64-mac.zip, Bear-Office-<v>-x64-mac.zip
#     Linux    Bear-Office-<v>-x64.AppImage, bear-office_<v>_amd64.deb, Bear-Office-<v>-x64.rpm,
#              Bear-Office-<v>-x64.tar.gz, Bear-Office-<v>-x64.flatpak (own job, non-blocking)
#   Edition "studio" (Bear Studio)
#     Windows  Bear-Studio-Setup-<v>.exe, Bear-Studio-<v>.msi
#     macOS    Bear-Studio-<v>-arm64.dmg, Bear-Studio-<v>-x64.dmg, Bear-Studio-<v>-arm64-mac.zip, Bear-Studio-<v>-x64-mac.zip
#     Linux    Bear-Studio-<v>-x64.AppImage, bear-studio_<v>_amd64.deb, Bear-Studio-<v>-x64.rpm,
#              Bear-Studio-<v>-x64.tar.gz, Bear-Studio-<v>-x64.flatpak (own job, non-blocking)
# No two editions share a file name, so the release job can merge all artifacts into one folder.
#
# Triggers: a v* tag (builds, then drafts the release), a manual run, or a push to the
# ci/release-dry-run branch (builds everything and uploads workflow artifacts, but creates no release).
name: Release

on:
  push:
    tags: ['v*']
    branches: ['ci/release-dry-run']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 3 platforms x 3 editions = 9 jobs. `target` and `edition` are the two axes; each include row below
        # matches its target and adds that platform's runner, script and files to all three editions.
        # (Include rows with no axis keys would instead be merged into every combination and overwrite each other.)
        target: [win, mac, linux]
        edition: [all, office, studio]
        include:
          - os: windows-latest
            target: win
            script: build:win
            files: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.msi
          - os: macos-latest
            target: mac
            script: build:mac
            files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: ubuntu-latest
            target: linux
            # AppImage, deb, rpm and tar.gz. Flatpak is built by the separate "flatpak" job.
            script: build:linux:main
            files: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
              apps/desktop/release/*.rpm
              apps/desktop/release/*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Failures are copied into an error annotation: run logs need a GitHub sign-in, annotations don't.
      # Typecheck and unit tests do not depend on the edition, so they run once per platform, in the "all" jobs.
      - name: Typecheck
        if: matrix.edition == 'all'
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          if [ $code -ne 0 ]; then echo "::error title=typecheck failed (exit $code)::$(head -c 1800 typecheck.log | tr '\r\n' '  ')"; fi
          exit $code
      - name: Unit tests
        if: matrix.edition == 'all'
        shell: bash
        run: |
          set +e
          pnpm test > unit.log 2>&1
          code=$?
          tail -n 30 unit.log
          if [ $code -ne 0 ]; then echo "::error title=unit tests failed (exit $code)::$(grep -E 'FAIL|Error|expected|received|✗|×' unit.log | head -c 1800 | tr '\r\n' '  ')"; fi
          exit $code
      - name: Install rpm tooling
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Build installers
        shell: bash
        run: |
          set +e
          # Without signing secrets GitHub passes these as EMPTY strings; electron-builder then reads an empty
          # CSC_LINK as a file path ("<project dir> not a file") and the macOS build dies. Unset them instead.
          if [ -z "${CSC_LINK}" ]; then unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          pnpm --filter @bear/desktop ${{ matrix.script }} --publish never > build.log 2>&1
          code=$?
          tail -n 60 build.log
          if [ $code -ne 0 ]; then echo "::error title=installer build failed (exit $code)::$(grep -vE '^[[:space:]]*$' build.log | tail -n 30 | cut -c1-240 | head -c 3500 | tr '\r\n' '  ')"; fi
          exit $code
        env:
          # Read by electron-builder.config.cjs and by electron-vite (the renderer build) for this edition.
          BEAR_EDITION: ${{ matrix.edition }}
          # Optional code signing. Without these secrets the installers are built unsigned.
          # Windows: a .pfx (base64) and its password. macOS: a Developer ID .p12 plus Apple ID
          # credentials for notarization.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: bear-${{ matrix.target }}-${{ matrix.edition }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Flatpak needs flatpak-builder and the Freedesktop runtime from Flathub, which is the part most
  # likely to break, so it runs on its own and never blocks the release.
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        edition: [all, office, studio]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Flatpak tooling and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
      - name: Build flatpak
        run: pnpm --filter @bear/desktop build:linux:flatpak --publish never
        env:
          BEAR_EDITION: ${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        with:
          name: bear-flatpak-${{ matrix.edition }}
          path: apps/desktop/release/*.flatpak
          if-no-files-found: error

  # One draft release, assembled after every build has finished (no parallel-upload race).
  release:
    needs: [build, flatpak]
    if: ${{ always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The flatpak artifact is simply missing when that job failed; the pattern match tolerates that.
      - uses: actions/download-artifact@v4
        with:
          pattern: bear-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
