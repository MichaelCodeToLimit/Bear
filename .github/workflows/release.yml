# Builds every Bear download and publishes them as a GitHub release.
#
# Automatic: a push to main whose apps/desktop/package.json version has no v<version> tag yet builds every
# installer, publishes the release (tag v<version>), then refreshes the website so its Download page lists the
# new files. To ship a new version, bump "version" in apps/desktop/package.json (and the root package.json)
# and push to main. Pushes that don't change the version stop after the first job.
# Manual: pushing a v* tag still builds and drafts a release for you to publish by hand.
#
# Files produced (the website's Download page classifies them by name, so keep these stable):
#   Windows  Bear-Setup-<v>.exe, Bear-<v>.msi
#   macOS    Bear-<v>-arm64.dmg, Bear-<v>-x64.dmg, Bear-<v>-arm64-mac.zip, Bear-<v>-x64-mac.zip
#   Linux    Bear-<v>-x64.AppImage, bear_<v>_amd64.deb, Bear-<v>-x64.rpm, Bear-<v>-x64.tar.gz,
#            Bear-<v>-x64.flatpak (own job; a failure there never blocks the release)
#
# Triggers: a push to main (see above), a v* tag (builds, then drafts the release), a manual run, or a push to
# the ci/release-dry-run branch (builds everything and uploads workflow artifacts, but creates no release).
name: Release

on:
  push:
    tags: ['v*']
    branches: ['main', 'ci/release-dry-run']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides whether this run builds anything. A push to main only does when its version is new.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.v.outputs.run }}
      auto: ${{ steps.v.outputs.auto }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          run=true
          auto=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            auto=true
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null 2>&1; then
              run=false
              echo "v$version is already released; nothing to build."
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "auto=$auto" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            script: build:win
            files: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.msi
          - os: macos-latest
            target: mac
            script: build:mac
            files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: ubuntu-latest
            target: linux
            # AppImage, deb, rpm and tar.gz. Flatpak is built by the separate "flatpak" job.
            script: build:linux:main
            files: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
              apps/desktop/release/*.rpm
              apps/desktop/release/*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Failures are copied into an error annotation: run logs need a GitHub sign-in, annotations don't.
      - name: Typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          if [ $code -ne 0 ]; then echo "::error title=typecheck failed (exit $code)::$(head -c 1800 typecheck.log | tr '\r\n' '  ')"; fi
          exit $code
      - name: Unit tests
        shell: bash
        run: |
          set +e
          pnpm test > unit.log 2>&1
          code=$?
          tail -n 30 unit.log
          if [ $code -ne 0 ]; then echo "::error title=unit tests failed (exit $code)::$(grep -E 'FAIL|Error|expected|received|✗|×' unit.log | head -c 1800 | tr '\r\n' '  ')"; fi
          exit $code
      - name: Install rpm tooling
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Build installers
        shell: bash
        run: |
          set +e
          # Without signing secrets GitHub passes these as EMPTY strings; electron-builder then reads an empty
          # CSC_LINK as a file path ("<project dir> not a file") and the macOS build dies. Unset them instead.
          if [ -z "${CSC_LINK}" ]; then unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          pnpm --filter @bear/desktop ${{ matrix.script }} --publish never > build.log 2>&1
          code=$?
          tail -n 60 build.log
          if [ $code -ne 0 ]; then echo "::error title=installer build failed (exit $code)::$(grep -vE '^[[:space:]]*$' build.log | tail -n 30 | cut -c1-240 | head -c 3500 | tr '\r\n' '  ')"; fi
          exit $code
        env:
          # Optional code signing. Without these secrets the installers are built unsigned.
          # Windows: a .pfx (base64) and its password. macOS: a Developer ID .p12 plus Apple ID
          # credentials for notarization.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: bear-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Flatpak needs flatpak-builder and the Freedesktop runtime from Flathub, which is the part most
  # likely to break, so it runs on its own and never blocks the release.
  flatpak:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Flatpak tooling and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
      - name: Build flatpak
        run: pnpm --filter @bear/desktop build:linux:flatpak --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: bear-flatpak
          path: apps/desktop/release/*.flatpak
          if-no-files-found: error

  # One release, assembled after every build has finished (no parallel-upload race). A v* tag push makes a
  # draft for you to publish; a push to main with a new version publishes it and refreshes the website.
  release:
    needs: [prepare, build, flatpak]
    if: ${{ always() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || needs.prepare.outputs.auto == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      AUTO: ${{ needs.prepare.outputs.auto }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # The flatpak artifact is simply missing when that job failed; the pattern match tolerates that.
      - uses: actions/download-artifact@v4
        with:
          pattern: bear-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.AUTO == 'true' && format('v{0}', env.VERSION) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ env.AUTO != 'true' }}
          generate_release_notes: true
          files: dist/*

      # Events made by GITHUB_TOKEN (like publishing this release) don't start other workflows, so the website
      # refresh is started by hand: GitHub Pages through its own workflow, and the Render copy by a new commit
      # on main (Render deploys every push, and its Download page is built from the latest release).
      - name: Refresh the website
        if: env.AUTO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
          git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site-refresh
          cd site-refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: refresh the website for v${VERSION}"
          git push origin main
