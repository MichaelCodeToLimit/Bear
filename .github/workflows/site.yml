# Builds, tests and deploys the Bear website (apps/site) to GitHub Pages.
#
# The Download page lists the files of the latest GitHub release, so publishing a release must rebuild the site.
# A release event runs with the TAG as its ref, and the `github-pages` environment only accepts deployments from
# main ("Tag v0.1.1 is not allowed to deploy to github-pages"). So a published (or edited, which is what attaching a file in the web UI is) release only re-runs this workflow
# on main (workflow_dispatch is the one event GITHUB_TOKEN is allowed to trigger); main then builds and deploys.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/core/**'
      - 'README.md'
      - '.github/workflows/site.yml'
      - 'playwright.site.config.ts'
      - 'e2e-site/**'
      - 'pnpm-lock.yaml'
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rebuild-on-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-run the site workflow on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run apps/site
      - run: pnpm --filter @bear/site check
      - run: pnpm site:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm site:test
        timeout-minutes: 10
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
