// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Capacitor's modules ask for a Java 21 toolchain. Android Studio now bundles a newer JDK, so build
// them with the JDK running Gradle while still emitting Java 21 bytecode (no JDK 21 install needed).
subprojects {
    afterEvaluate {
        def kotlinExt = extensions.findByName('kotlin')
        if (kotlinExt != null && JavaVersion.current() != JavaVersion.VERSION_21) {
            java.toolchain.languageVersion = JavaLanguageVersion.of(JavaVersion.current().majorVersion)
            def jvmTarget = kotlinExt.compilerOptions.jvmTarget
            jvmTarget.set(jvmTarget.get().fromTarget('21'))
        }
    }
}
